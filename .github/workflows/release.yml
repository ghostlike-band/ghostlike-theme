# Baut bei jedem Tag „v1.2.3“ die Datei ghostlike.zip und hängt sie an ein GitHub-Release.
# WordPress (inc/updater.php) findet das Release und bietet das Update per Klick an.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen (Tag = style.css)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^Version:' style.css | awk '{print $2}')
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $VER in style.css"
            exit 1
          fi

      - name: ZIP bauen
        run: |
          mkdir -p build/ghostlike
          rsync -a --exclude-from=.distignore ./ build/ghostlike/
          cd build && zip -rq ghostlike.zip ghostlike

      # Kleine Versionsdatei: WordPress liest sie über den normalen Download-Weg
      # (kein API-Limit, wichtig auf Shared Hosting mit geteilter IP)
      - name: release.json schreiben
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=$(git log -1 --format=%B "$GITHUB_SHA" | grep -v '^Co-Authored-By' )
          jq -n --arg v "$VER" --arg tag "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, package: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/ghostlike.zip"), url: ("https://github.com/" + $repo + "/releases/tag/" + $tag), notes: $notes, date: $date}' > build/release.json
          cat build/release.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ghostlike.zip
            build/release.json
          generate_release_notes: true
